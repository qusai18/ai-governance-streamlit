# Port and address come from STREAMLIT_SERVER_PORT / STREAMLIT_SERVER_ADDRESS, which
# Databricks Apps sets; the command is not run through a shell, so don't use ${...} here.
command:
  - streamlit
  - run
  - app.py
env:
  # The Apps proxy origin differs from the workspace origin; Streamlit's checks must be off.
  - name: STREAMLIT_SERVER_ENABLE_CORS
    value: "false"
  - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
    value: "false"
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
  # PGHOST, PGPORT, PGDATABASE, PGUSER and PGSSLMODE are injected from the `postgres` resource.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: AIGOV_SCHEMA
    value: "aigov"
  # Postgres roles the app grants read/write on the schema at startup (comma-separated).
  # e8e45679-...: service principal "ai-governance-streamlit-cloud" used by the Streamlit Cloud copy.
  - name: AIGOV_GRANT_ROLES
    value: "e8e45679-37ee-4b25-a0df-f38932634195"
